openapi: 3.0.1
info:
  title: API
  version: 1.0.0
paths:
  /weather/{cityName}:
    get:
      tags:
        - weatherApiController
      summary: Some summary
      operationId: weatherGET
      parameters:
        - name: cityName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: returns the weather details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
  /events/{location}:
    get:
      tags:
        - eventsApiController
      summary: Some summary
      operationId: eventsGET
      parameters:
        - name: location
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: returns the events details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events'
  /location:
    get:
      tags:
        - locationApiController
      summary: Some summary
      description: >
        At least one of the following query parameters must be provided:
        **postalCode** or **city**.
      operationId: locationGET
      parameters:
        - name: postalCode
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: returns the location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations'


components:
  schemas:
    Weather:
      type: object
      required:
        - elevation
        - hourly
      properties:
        elevation:
          type: number
          format: double
          example: 3.44
        hourly:
          type: array
          items:
            $ref: '#/components/schemas/Hourly'
    Hourly:
      type: object
      required:
        - time
        - temp
        - humidity
        - wind
        - precipitation
      properties:
        time:
          type: string
        temp:
          type: number
          format: double
          example: 10.6
        humidity:
          type: integer
        wind:
          type: number
          format: double
          example: 10.6
        precipitation:
          type: number
          format: double
          example: 10.6
    Events:
      type: object
      required:
        - eventsList
      properties:
        eventsList:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    Event:
      type: object
      required:
        - title
        - date
        - address
        - locationImageUrl
        - description
      properties:
        title:
          type: string
        date:
          type: string
        address:
          type: string
        locationImageUrl:
          type: string
        description:
          type: string
    Locations:
      type: object
      required:
        - locationsList
      properties:
        locationsList:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    Location:
      type: object
      required:
        - postalCode
        - city
        - canton
      properties:
        postalCode:
          type: string
        city:
          type: string
        canton:
          type: string